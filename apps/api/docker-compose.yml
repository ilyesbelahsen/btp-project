version: '1.0'
services:
  postgres_btp:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
    volumes:
      - pg_btp:/var/lib/postgresql/data
    ports:
      - 46662:5432

  redis_btp:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379

volumes:
  pg_btp:
