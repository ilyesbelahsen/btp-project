version: "1.0"
services:
  postgres_btp:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
    volumes:
      - pg_btp:/var/lib/postgresql/data
    ports:
      - 46662:5432

volumes:
  pg_btp:
